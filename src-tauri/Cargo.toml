[package]
name = "siptrace"
version = "1.1.0"
description = "SIPTrace"
authors = ["SIPTrace"]
edition = "2021"

[lib]
name = "siptrace_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "SIPTrace"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
